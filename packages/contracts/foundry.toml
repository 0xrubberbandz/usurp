[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.31"
evm_version = "osaka"
network = "monad"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read-write", path = "../../apps/web/public/deployments" }]

[fuzz]
runs = 256

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"
