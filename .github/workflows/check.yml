name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:install
      - run: pnpm test
      - run: pnpm contracts:abi && git diff --exit-code apps/web/lib/abi.ts
      - run: pnpm test:integration
      - run: pnpm typecheck && pnpm check:brand
      - run: pnpm build
        env:
          NEXT_PUBLIC_DEMO: '1'
      - run: pnpm --filter @usurp/web exec playwright install --with-deps chromium
      - run: pnpm test:browser
